<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="535" viewBox="0 0 1200 535" role="img" aria-labelledby="t d">
<title id="t">Auralis — job search workflow</title><desc id="d">Dark emerald workflow illustration with three panels: discover openings, assess fit, and prepare an application. This is a conceptual visual, not a product screenshot.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07120e"/><stop offset=".6" stop-color="#0d2017"/><stop offset="1" stop-color="#071911"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#33c775"/><stop offset="1" stop-color="#a0ffd0"/></linearGradient><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12291c"/><stop offset="1" stop-color="#0b1b14"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#79dca3" stroke-opacity=".055"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="3"/></filter></defs>
<style>.traveler{animation:move 6s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.signal{stroke-dasharray:7 16;animation:dash 10s linear infinite}@keyframes move{0%{transform:translateX(0px);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(890px);opacity:0}}@keyframes pulse{50%{opacity:.3}}@keyframes dash{to{stroke-dashoffset:-230}}@media(prefers-reduced-motion:reduce){.traveler,.pulse,.signal{animation:none}}</style>
