<text x="48" y="141" font-family="Arial,sans-serif" font-size="41" font-weight="700" fill="#f0fff5">Auralis<tspan fill="#71e9a0">.</tspan></text><text x="48" y="177" font-family="Consolas,Menlo,monospace" font-size="18" fill="#91b9a0">From job discovery to a more organized application.</text>
