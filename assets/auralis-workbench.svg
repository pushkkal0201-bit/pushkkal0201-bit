<g font-family="Arial,sans-serif">
<rect x="41" y="252" width="351" height="217" rx="15" fill="url(#panel)" stroke="#37724d"/><circle cx="68" cy="282" r="8" fill="#77eca4"/><text x="87" y="290" font-family="Consolas,Menlo,monospace" font-size="16" fill="#88dca2">01 / DISCOVER</text><text x="65" y="336" font-size="30" font-weight="700" fill="#ecfff1">Find openings</text><text x="65" y="368" font-size="16" fill="#a7c3ad">Bring relevant opportunities</text><text x="65" y="391" font-size="16" fill="#a7c3ad">into one workflow.</text><rect x="65" y="417" width="140" height="10" rx="5" fill="#2c6b45"/><rect x="65" y="440" width="215" height="7" rx="3.5" fill="#224e36"/>
<rect x="424" y="252" width="351" height="217" rx="15" fill="url(#panel)" stroke="#37724d"/><circle cx="451" cy="282" r="8" fill="#77eca4"/><text x="470" y="290" font-family="Consolas,Menlo,monospace" font-size="16" fill="#88dca2">02 / ASSESS</text><text x="448" y="336" font-size="30" font-weight="700" fill="#ecfff1">Check fit</text><text x="448" y="368" font-size="16" fill="#a7c3ad">Compare a role with skills</text><text x="448" y="391" font-size="16" fill="#a7c3ad">and experience.</text><rect x="448" y="417" width="181" height="10" rx="5" fill="#2c6b45"/><rect x="448" y="440" width="252" height="7" rx="3.5" fill="#224e36"/>
<rect x="807" y="252" width="351" height="217" rx="15" fill="url(#panel)" stroke="#37724d"/><circle cx="834" cy="282" r="8" fill="#77eca4"/><text x="853" y="290" font-family="Consolas,Menlo,monospace" font-size="16" fill="#88dca2">03 / PREPARE</text><text x="831" y="336" font-size="30" font-weight="700" fill="#ecfff1">Stay organized</text><text x="831" y="368" font-size="16" fill="#a7c3ad">Keep application steps</text><text x="831" y="391" font-size="16" fill="#a7c3ad">and preparation together.</text><rect x="831" y="417" width="167" height="10" rx="5" fill="#2c6b45"/><rect x="831" y="440" width="245" height="7" rx="3.5" fill="#224e36"/>
