<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420"
     viewBox="0 0 1200 420"
     role="img" aria-labelledby="title description">

  <title id="title">Pushkkal Gupta — Neural Terminal</title>
  <desc id="description">
    Animated cyberpunk banner with rotating neon rings,
    moving circuit signals, and a scanning beam.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="0.6" stop-color="#121028"/>
      <stop offset="1" stop-color="#071B25"/>
    </linearGradient>

    <linearGradient id="accent">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#FF2BD6"/>
    </linearGradient>

    <linearGradient id="scanner">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="halo">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40"
             patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40"
            fill="none"
            stroke="#00E5FF"
            stroke-opacity="0.07"/>
    </pattern>

    <pattern id="scanlines" width="4" height="6"
             patternUnits="userSpaceOnUse">
      <path d="M0 0H4"
            stroke="#FFFFFF"
            stroke-opacity="0.025"/>
    </pattern>

    <filter id="glow" x="-60%" y="-60%"
            width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="frame">
      <rect x="1" y="1" width="1198" height="418" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">

    <!-- Background -->
    <rect width="1200" height="420" fill="url(#background)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <rect width="1200" height="420" fill="url(#scanlines)"/>

    <circle cx="955" cy="208" r="220" fill="url(#halo)"/>

    <!-- Animated scanning beam -->
    <rect x="-180" width="180" height="420" fill="url(#scanner)">
      <animate attributeName="x"
               values="-180;1200"
               dur="9s"
               repeatCount="indefinite"/>
    </rect>

    <!-- Corner brackets -->
    <path d="M28 72V28H110
             M1090 28H1172V72
             M28 348V392H110
             M1090 392H1172V348"
          fill="none"
          stroke="url(#accent)"
          stroke-width="2"/>

    <!-- Circuit tracks -->
    <path d="M55 94H710L740 64H1130"
          fill="none"
          stroke="#26354B"/>

    <path d="M55 335H690L720 365H1130"
          fill="none"
          stroke="#26354B"/>

    <!-- Moving magenta signal -->
    <path d="M55 335H690L720 365H1130"
          fill="none"
          stroke="#FF2BD6"
          stroke-width="2"
          stroke-dasharray="70 1100">
      <animate attributeName="stroke-dashoffset"
               values="1100;-1100"
               dur="8s"
               repeatCount="indefinite"/>
    </path>

    <!-- Moving cyan signal -->
    <path d="M55 94H710L740 64H1130"
          fill="none"
          stroke="#00E5FF"
          stroke-width="2"
          stroke-dasharray="60 1100">
      <animate attributeName="stroke-dashoffset"
               values="1100;-1100"
               dur="10s"
               repeatCount="indefinite"/>
    </path>

    <!-- Profile text -->
    <g font-family="monospace">

      <circle cx="62" cy="57" r="4" fill="#00E5FF">
        <animate attributeName="opacity"
                 values="1;0.35;1"
                 dur="3s"
                 repeatCount="indefinite"/>
      </circle>

      <text x="78" y="62"
            fill="#00E5FF"
            font-size="13"
            letter-spacing="3">
        PERSONAL TERMINAL / PG
      </text>

      <text x="57" y="140"
            fill="#A78BFA"
            font-size="13"
            letter-spacing="4">
        TECHNOLOGY · IMAGINATION · ITERATION
      </text>

      <text x="53" y="210"
            fill="#F0F6FF"
            font-size="59"
            font-weight="700"
            letter-spacing="1">
        PUSHKKAL
      </text>

      <text x="55" y="270"
            fill="#00E5FF"
            font-size="59"
            font-weight="700"
            letter-spacing="5">
        GUPTA
      </text>

      <!-- Terminal cursor -->
      <rect x="270" y="227"
            width="12" height="43"
            fill="#FF2BD6">
        <animate attributeName="opacity"
                 values="1;1;0.1;0.1;1"
                 dur="2s"
                 repeatCount="indefinite"/>
      </rect>

      <text x="57" y="308"
            fill="#A5B4CA"
            font-size="14"
            letter-spacing="2">
        CODE THE PRESENT. ENGINEER THE FUTURE.
      </text>

      <text x="57" y="378"
            fill="#74859E"
            font-size="11"
            letter-spacing="2">
        GITHUB / PUSHKKAL0201-BIT
      </text>

    </g>

    <!-- Animated reactor -->
    <g transform="translate(955 208)">

      <circle r="127"
              fill="none"
              stroke="#20354B"/>

      <circle r="112"
              fill="none"
              stroke="#00E5FF"
              stroke-opacity="0.25"
              stroke-dasharray="2 10"/>

      <!-- Clockwise outer ring -->
      <g>
        <animateTransform attributeName="transform"
                          type="rotate"
                          from="0"
                          to="360"
                          dur="35s"
                          repeatCount="indefinite"/>

        <circle r="120"
                fill="none"
                stroke="#00E5FF"
                stroke-width="3"
                stroke-dasharray="100 88"/>

        <circle cx="120" cy="0" r="5"
                fill="#00E5FF"
                filter="url(#glow)"/>
      </g>

      <!-- Counterclockwise inner ring -->
      <g>
        <animateTransform attributeName="transform"
                          type="rotate"
                          from="360"
                          to="0"
                          dur="24s"
                          repeatCount="indefinite"/>

        <circle r="91"
                fill="none"
                stroke="#FF2BD6"
                stroke-width="2"
                stroke-dasharray="52 40"/>

        <circle cx="0" cy="-91" r="4"
                fill="#FF2BD6"
                filter="url(#glow)"/>
      </g>

      <!-- Rotating hexagon -->
      <g>
        <animateTransform attributeName="transform"
                          type="rotate"
                          from="0"
                          to="360"
                          dur="48s"
                          repeatCount="indefinite"/>

        <path d="M0-69L60-35V35L0 69L-60 35V-35Z"
              fill="none"
              stroke="#A78BFA"
              stroke-width="1.5"/>
      </g>

      <!-- Reactor core -->
      <circle r="50"
              fill="#0A1220"
              stroke="#00E5FF"
              stroke-opacity="0.5"/>

      <!-- Pulsing energy ring -->
      <circle r="42"
              fill="none"
              stroke="#00E5FF">

        <animate attributeName="r"
                 values="42;57;42"
                 dur="4s"
                 repeatCount="indefinite"/>

        <animate attributeName="opacity"
                 values="0.7;0.1;0.7"
                 dur="4s"
                 repeatCount="indefinite"/>
      </circle>

      <text y="10"
            text-anchor="middle"
            font-family="monospace"
            font-size="31"
            font-weight="700"
            fill="#F0F6FF">
        PG
      </text>

      <!-- Crosshair markers -->
      <path d="M-145 0H-132
               M132 0H145
               M0-145V-132
               M0 132V145"
            stroke="#00E5FF"
            stroke-width="2"/>

    </g>

    <text x="955" y="378"
          text-anchor="middle"
          font-family="monospace"
          font-size="11"
          fill="#A78BFA"
          letter-spacing="3">
      NEXT ITERATION LOADING
    </text>

    <!-- Outer border -->
    <rect x="1" y="1"
          width="1198" height="418"
          rx="20"
          fill="none"
          stroke="#24304A"
          stroke-width="2"/>

  </g>
</svg>
