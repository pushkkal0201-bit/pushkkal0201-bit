<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
<title id="title">Animated green ASCII portrait card for Pushkkal Gupta</title>
<desc id="desc">Matrix-style GitHub profile card with a portrait of Pushkkal Gupta assembled from animated falling green characters.</desc>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#010301"/>
    <stop offset="1" stop-color="#06110a"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="2.4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <clipPath id="portraitClip"><rect x="34" y="116" width="492" height="576" rx="20"/></clipPath>
  <clipPath id="cardClip"><rect x="0" y="0" width="1320" height="760" rx="26"/></clipPath>
  <style>
    .mono { font-family: Consolas, Menlo, 'Liberation Mono', monospace; }
    .sans { font-family: Inter, Segoe UI, Arial, sans-serif; }
    .portraitRow { fill: #b6ffbe; font-size: 10.6px; letter-spacing: 0.2px; opacity: 0; animation: rowDrop 820ms cubic-bezier(.17,.84,.44,1) forwards; }
    .portraitRow.dim { fill: #7efb93; }
    .rain { fill: #63ff75; opacity: .28; font-size: 14px; animation: rain linear infinite; }
    .scan { animation: scan 4s linear infinite; }
    .flicker { animation: flicker 4s steps(1) infinite; }
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes rowDrop {
      0% { opacity: 0; transform: translateY(-42px); }
      35% { opacity: 0.25; }
      100% { opacity: 1; transform: translateY(0px); }
    }
    @keyframes rain {
      0% { transform: translateY(-240px); }
      100% { transform: translateY(900px); }
    }
    @keyframes scan {
      0%,100% { transform: translateY(0px); opacity: 0; }
      10% { opacity: .0; }
      20% { opacity: .85; }
      60% { opacity: .25; }
      100% { transform: translateY(540px); opacity: 0; }
    }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes flicker {
      0%, 92%, 100% { opacity: 1; }
      93% { opacity: .8; }
      94% { opacity: 1; }
      95% { opacity: .72; }
      96% { opacity: 1; }
    }
  </style>

  <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b6ffbe" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#b6ffbe" stop-opacity="1"/>
    <stop offset="1" stop-color="#b6ffbe" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect width="1320" height="760" rx="26" fill="url(#bgGrad)"/>
<rect x="1" y="1" width="1318" height="758" rx="25" fill="none" stroke="#17321c" stroke-width="2"/>
<circle cx="38" cy="36" r="8" fill="#ff5f56"/>
<circle cx="62" cy="36" r="8" fill="#ffbd2e"/>
<circle cx="86" cy="36" r="8" fill="#27c93f"/>
